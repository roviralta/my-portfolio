[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — Netlify serves index.html for unmatched paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Immutable asset cache — filenames are content-hashed by Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"